<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Inter, sans-serif">
  <rect width="600" height="320" fill="#faf9f8" rx="12"/>
  
  <!-- Kratky side -->
  <rect x="30" y="20" width="260" height="280" fill="white" rx="8" stroke="#e5e7eb" stroke-width="1"/>
  <text x="160" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#1a6b3a">🥇 Kratky Method</text>
  <text x="160" y="75" text-anchor="middle" font-size="11" fill="#615d59">Passive — No pumps needed</text>
  
  <!-- Jar -->
  <rect x="100" y="100" width="120" height="150" rx="4" fill="#e8f8f0" stroke="#a8e6c1" stroke-width="1.5"/>
  <rect x="105" y="100" width="110" height="20" rx="2" fill="#2ecc71" opacity="0.2"/>
  <text x="160" y="115" text-anchor="middle" font-size="10" fill="#615d59">Net cup</text>
  
  <!-- Water level -->
  <rect x="105" y="140" width="110" height="80" rx="2" fill="#2ecc71" opacity="0.15"/>
  <text x="160" y="185" text-anchor="middle" font-size="10" fill="#615d59">Nutrient water</text>
  
  <!-- Air gap -->
  <rect x="105" y="120" width="110" height="20" rx="2" fill="white" opacity="0.6"/>
  <text x="160" y="134" text-anchor="middle" font-size="9" fill="#7a5538">Air gap (grows)</text>
  
  <!-- Roots -->
  <line x1="145" y1="120" x2="135" y2="220" stroke="#7a5538" stroke-width="1.5"/>
  <line x1="160" y1="120" x2="160" y2="235" stroke="#7a5538" stroke-width="1.5"/>
  <line x1="175" y1="120" x2="185" y2="220" stroke="#7a5538" stroke-width="1.5"/>
  
  <!-- Labels -->
  <text x="160" y="275" text-anchor="middle" font-size="10" fill="#615d59">$5-20 · 1/10 difficulty</text>
  <text x="160" y="292" text-anchor="middle" font-size="10" fill="#a39e98">Best for: lettuce, herbs</text>
  
  <!-- DWC side -->
  <rect x="310" y="20" width="260" height="280" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="440" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#1a6b3a">🥈 DWC (Deep Water Culture)</text>
  <text x="440" y="75" text-anchor="middle" font-size="11" fill="#615d59">Active — uses air pump</text>
  
  <!-- Bucket -->
  <rect x="360" y="95" width="160" height="155" rx="6" fill="#1c1b1a" stroke="#44403c" stroke-width="1.5"/>
  <rect x="365" y="95" width="150" height="18" rx="3" fill="#2ecc71" opacity="0.25"/>
  <text x="440" y="109" text-anchor="middle" font-size="10" fill="#a39e98">Lid with net cups</text>
  
  <!-- Water -->
  <rect x="365" y="135" width="150" height="90" rx="2" fill="#2ecc71" opacity="0.15"/>
  <text x="440" y="185" text-anchor="middle" font-size="10" fill="#615d59">Nutrient water</text>
  
  <!-- Bubbles -->
  <circle cx="400" cy="200" r="3" fill="#2ecc71" opacity="0.4"/>
  <circle cx="440" cy="215" r="2.5" fill="#2ecc71" opacity="0.4"/>
  <circle cx="470" cy="195" r="3.5" fill="#2ecc71" opacity="0.4"/>
  
  <!-- Air stone -->
  <rect x="420" y="225" width="40" height="8" rx="4" fill="#6b7280"/>
  <text x="440" y="237" text-anchor="middle" font-size="8" fill="#a39e98">Air stone</text>
  
  <!-- Pump -->
  <rect x="465" y="240" width="30" height="20" rx="3" fill="#d4f5e0" stroke="#a8e6c1" stroke-width="1"/>
  <text x="480" y="253" text-anchor="middle" font-size="7" fill="#1a6b3a">Pump</text>
  
  <!-- Tube -->
  <line x1="470" y1="240" x2="440" y2="233" stroke="#6b7280" stroke-width="1.5"/>
  
  <!-- Roots -->
  <line x1="420" y1="115" x2="410" y2="225" stroke="#7a5538" stroke-width="1.5"/>
  <line x1="440" y1="113" x2="440" y2="230" stroke="#7a5538" stroke-width="1.5"/>
  <line x1="460" y1="115" x2="470" y2="225" stroke="#7a5538" stroke-width="1.5"/>
  
  <text x="440" y="275" text-anchor="middle" font-size="10" fill="#615d59">$50-150 · 3/10 difficulty</text>
  <text x="440" y="292" text-anchor="middle" font-size="10" fill="#a39e98">Best for: lettuce, kale, peppers</text>
</svg>